<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>3球体 3D ビューア</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;font:13px/1.5 system-ui,"Hiragino Sans","Yu Gothic",sans-serif;color:#eee}
body{background:#000}
body.white{background:#fff}
body.clear{background:repeating-conic-gradient(#555 0 25%,#444 0 50%) 0 0/20px 20px}
canvas{display:block;width:100%;height:100%;cursor:grab;touch-action:none}
#panel{position:fixed;top:10px;left:10px;width:230px;max-height:calc(100% - 20px);overflow:auto;background:rgba(20,22,30,.88);border:1px solid #444;border-radius:10px;padding:12px;backdrop-filter:blur(6px)}
#panel h3{margin:10px 0 4px;font-size:12px;color:#8ab4ff;border-bottom:1px solid #444}
#panel h3:first-child{margin-top:0}
label{display:flex;align-items:center;gap:6px;margin:2px 0}
.row{display:flex;align-items:center;justify-content:space-between;gap:6px;margin:3px 0}
input[type=number]{width:80px;background:#111;color:#eee;border:1px solid #555;border-radius:4px;padding:2px 4px}
select,button{background:#2a3350;color:#eee;border:1px solid #556;border-radius:5px;padding:4px 8px;cursor:pointer}
button:hover{background:#3a4670}
input[type=range]{width:110px}
#toggle{position:fixed;top:10px;right:10px}
.btns{display:flex;gap:6px;margin-top:6px;flex-wrap:wrap}
</style>
</head>
<body>
<canvas id="c"></canvas>
<button id="toggle">パネル</button>
<div id="panel">
  <h3>球の半径</h3>
  <div class="row"><span>左の大球</span><input type="number" id="rL" value="1" step="0.1" min="0.05"></div>
  <div class="row"><span>中央の大球</span><input type="number" id="rM" value="1" step="0.1" min="0.05"></div>
  <div class="row"><span>右の大球</span><input type="number" id="rR" value="1" step="0.1" min="0.05"></div>
  <div class="row"><span>中心の小球</span><input type="number" id="rS" value="0.5" step="0.05" min="0.05"></div>
  <div class="row"><span>球の間隔</span><input type="number" id="gap" value="1" step="0.1" min="0.1"></div>

  <h3>表示 ON/OFF</h3>
  <label><input type="checkbox" data-g="sphL" checked>左の大球</label>
  <label><input type="checkbox" data-g="sphM" checked>中央の大球</label>
  <label><input type="checkbox" data-g="sphR" checked>右の大球</label>
  <label><input type="checkbox" data-g="sphS" checked>中心の小球</label>
  <label><input type="checkbox" data-g="eqL" checked>左 水平円</label>
  <label><input type="checkbox" data-g="eqR" checked>右 水平円</label>
  <label><input type="checkbox" data-g="vtL" checked>左 垂直円</label>
  <label><input type="checkbox" data-g="vtR" checked>右 垂直円</label>
  <label><input type="checkbox" data-g="axis" checked>青い軸線</label>
  <label><input type="checkbox" data-g="pink" checked>ピンクの線</label>
  <label><input type="checkbox" data-g="pts" checked>中心点</label>

  <h3>見た目</h3>
  <div class="row"><span>背景</span>
    <select id="bg"><option value="black">黒</option><option value="white">白</option><option value="clear">透明</option></select></div>
  <div class="row"><span>球の濃さ</span><input type="range" id="op" min="0.2" max="2.5" step="0.1" value="1"></div>
  <label><input type="checkbox" id="auto">自動回転</label>

  <h3>出力</h3>
  <div class="row"><span>倍率</span>
    <select id="scale"><option value="1">1x</option><option value="2" selected>2x</option><option value="4">4x</option></select></div>
  <div class="btns"><button id="save">PNG保存</button><button id="reset">視点リセット</button></div>
  <p style="color:#999;margin:8px 0 0">ドラッグ:回転 / ホイール:ズーム</p>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const $ = id => document.getElementById(id);
const canvas = $('c');
const renderer = new THREE.WebGLRenderer({canvas, antialias:true, alpha:true, preserveDrawingBuffer:true});
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(30, 1, 0.1, 100);
const root = new THREE.Group();
scene.add(root);
let dist = 11;
const DEF_ROT = {x:0.28, y:0};
root.rotation.set(DEF_ROT.x, DEF_ROT.y, 0);

let groups = {};
const THEMES = {
  dark:  {line:0xffffff, axis:0x5aa0ff, pink:0xe6b8f0, add:true},
  light: {line:0x1a1d2e, axis:0x1f62d0, pink:0xb04cc4, add:false}
};

function sphereMat(color, additive){
  return new THREE.ShaderMaterial({
    transparent:true, depthWrite:false, side:THREE.DoubleSide,
    blending: additive ? THREE.AdditiveBlending : THREE.NormalBlending,
    uniforms:{uC:{value:new THREE.Color(color)}, uA:{value:+$('op').value}},
    vertexShader:`varying vec3 vN;varying vec3 vV;
      void main(){vN=normalize(normalMatrix*normal);vec4 mv=modelViewMatrix*vec4(position,1.);vV=-mv.xyz;gl_Position=projectionMatrix*mv;}`,
    fragmentShader:`uniform vec3 uC;uniform float uA;varying vec3 vN;varying vec3 vV;
      void main(){float f=1.-abs(dot(normalize(vN),normalize(vV)));
      float a=uA*(0.07+pow(f,2.6)*0.7);gl_FragColor=vec4(uC,clamp(a,0.,1.));}`
  });
}
function circle(cx, r, plane, mat){
  const p=[];
  for(let i=0;i<=128;i++){
    const t=i/128*Math.PI*2, c=Math.cos(t)*r, s=Math.sin(t)*r;
    p.push(plane==='eq' ? new THREE.Vector3(cx,0,0).add(new THREE.Vector3(c,0,s)) : new THREE.Vector3(cx,c,s));
  }
  return new THREE.Line(new THREE.BufferGeometry().setFromPoints(p), mat);
}
function line(pts, mat){ return new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts.map(a=>new THREE.Vector3(...a))), mat); }

function build(){
  Object.values(groups).forEach(g=>{ root.remove(g); g.traverse(o=>{o.geometry&&o.geometry.dispose();o.material&&o.material.dispose();}); });
  groups = {};
  const bg = $('bg').value;
  const th = bg==='white' ? THEMES.light : THEMES.dark;
  const rL=+$('rL').value, rM=+$('rM').value, rR=+$('rR').value, rS=+$('rS').value, gap=+$('gap').value;
  const xL=-gap, xR=gap;
  const lineMat = new THREE.LineBasicMaterial({color:th.line, transparent:true, opacity:.95});
  const axisMat = new THREE.LineBasicMaterial({color:th.axis});
  const pinkMat = new THREE.LineBasicMaterial({color:th.pink});
  const add = (name, ...objs)=>{ const g=new THREE.Group(); objs.forEach(o=>g.add(o)); g.visible=document.querySelector(`[data-g=${name}]`)?.checked ?? true; groups[name]=g; root.add(g); };
  const sph = (x,r)=>{ const m=new THREE.Mesh(new THREE.SphereGeometry(r,64,48), sphereMat(th.line, th.add)); m.position.x=x; return m; };

  add('sphL', sph(xL,rL)); add('sphM', sph(0,rM)); add('sphR', sph(xR,rR)); add('sphS', sph(0,rS));
  add('eqL', circle(xL,rL,'eq',lineMat)); add('eqR', circle(xR,rR,'eq',lineMat));
  add('vtL', circle(xL,rL,'vt',lineMat)); add('vtR', circle(xR,rR,'vt',lineMat));
  add('axis', line([[xL,0,0],[xR,0,0]], axisMat));
  const pk = (x,r)=>line([[x,0,0],[x,r*0.27,r*0.3],[x,r,0]], pinkMat);
  add('pink', pk(xL,rL), pk(xR,rR));
  const dot = x=>{ const m=new THREE.Mesh(new THREE.SphereGeometry(0.03,16,12), new THREE.MeshBasicMaterial({color:th.axis})); m.position.x=x; return m; };
  add('pts', dot(xL), dot(0), dot(xR));

  document.body.className = bg==='white' ? 'white' : bg==='clear' ? 'clear' : '';
  if(bg==='black') renderer.setClearColor(0x000000,1);
  else if(bg==='white') renderer.setClearColor(0xffffff,1);
  else renderer.setClearColor(0x000000,0);
}

function resize(){
  const w=innerWidth,h=innerHeight;
  renderer.setSize(w,h,false);
  camera.aspect=w/h;
  camera.updateProjectionMatrix();
}
function fitDist(){
  const ext = Math.max(+$('rL').value, +$('rR').value, +$('rM').value) + +$('gap').value;
  const vf = camera.fov*Math.PI/180/2;
  const hf = Math.atan(Math.tan(vf)*camera.aspect);
  dist = Math.max(ext/Math.sin(Math.min(vf,hf)) * 0.95, 3);
}
function frame(){
  if($('auto').checked) root.rotation.y += 0.005;
  camera.position.set(0,0,dist);
  camera.lookAt(0,0,0);
  renderer.render(scene,camera);
  requestAnimationFrame(frame);
}

// 操作
let drag=null;
canvas.addEventListener('pointerdown',e=>{drag={x:e.clientX,y:e.clientY};canvas.setPointerCapture(e.pointerId);canvas.style.cursor='grabbing';});
canvas.addEventListener('pointermove',e=>{
  if(!drag) return;
  root.rotation.y += (e.clientX-drag.x)*0.008;
  root.rotation.x += (e.clientY-drag.y)*0.008;
  drag={x:e.clientX,y:e.clientY};
});
canvas.addEventListener('pointerup',()=>{drag=null;canvas.style.cursor='grab';});
canvas.addEventListener('wheel',e=>{e.preventDefault();dist*=Math.exp(e.deltaY*0.001);dist=Math.min(Math.max(dist,2),60);},{passive:false});

document.querySelectorAll('[data-g]').forEach(cb=>cb.addEventListener('change',()=>{groups[cb.dataset.g].visible=cb.checked;}));
['rL','rM','rR','rS','gap'].forEach(id=>$(id).addEventListener('input',()=>{ if(+$(id).value>0){build(); if(id!=='rS') fitDist();} }));
$('bg').addEventListener('change',build);
$('op').addEventListener('input',()=>['sphL','sphM','sphR','sphS'].forEach(n=>groups[n].children[0].material.uniforms.uA.value=+$('op').value));
$('reset').addEventListener('click',()=>{root.rotation.set(DEF_ROT.x,DEF_ROT.y,0);fitDist();});
$('toggle').addEventListener('click',()=>{const p=$('panel');p.style.display=p.style.display==='none'?'':'none';});
$('save').addEventListener('click',()=>{
  const s=+$('scale').value, pr=renderer.getPixelRatio();
  renderer.setPixelRatio(s);
  renderer.setSize(innerWidth,innerHeight,false);
  camera.position.set(0,0,dist); camera.lookAt(0,0,0);
  renderer.render(scene,camera);
  const url=canvas.toDataURL('image/png');
  renderer.setPixelRatio(pr);
  renderer.setSize(innerWidth,innerHeight,false);
  const a=document.createElement('a');
  a.href=url; a.download='noos_construction_'+$('bg').value+'.png'; a.click();
});
addEventListener('resize',()=>{resize();fitDist();});

resize(); build(); fitDist(); frame();
</script>
</body>
</html>
